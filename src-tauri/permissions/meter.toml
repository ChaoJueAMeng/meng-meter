[[permission]]
identifier = "allow-meter-commands"
description = "允许悬浮球读取系统状态并控制贴边窗口"
commands.allow = [
  "get_stats",
  "get_cpu_temp",
  "get_mode",
  "begin_drag",
  "set_hover",
  "get_settings",
  "save_settings",
  "close_settings",
  "open_log_dir",
  "open_ball_menu",
  "list_gpus",
  "get_overlay",
  "save_overlay_style",
  "overlay_begin_drag",
  "overlay_begin_resize",
  "set_overlay_locked",
  "set_overlay_shown",
  "set_overlay_visible"
]
