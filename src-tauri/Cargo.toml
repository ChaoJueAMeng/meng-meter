[package]
name = "meng-meter"
version = "0.1.0"
description = "Meng meter floating memory and network widget"
authors = ["you"]
edition = "2021"

[lib]
name = "meng_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
