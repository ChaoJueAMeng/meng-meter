<!doctype html>
<html lang="zh-CN" data-mode="expanded">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meng meter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="widget">
      <div id="pill">
        <div class="ring-wrap">
          <svg viewBox="0 0 56 56" aria-hidden="true">
            <circle class="ring-bg" cx="28" cy="28" r="22" />
            <circle class="ring-fg" id="ring" cx="28" cy="28" r="22" />
          </svg>
          <span id="percent">0%</span>
        </div>
        <div class="info">
          <div class="title">
            <span class="logo">M</span>
            <span>Meng meter</span>
          </div>
          <div class="speeds">
            <span class="up">↑ <b id="up">0 B/s</b></span>
            <span class="down">↓ <b id="down">0 B/s</b></span>
          </div>
        </div>
      </div>
      <div id="bar">
        <div id="bar-fill"></div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
