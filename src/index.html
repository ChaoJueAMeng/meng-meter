<!doctype html>
<html lang="zh-CN" data-mode="expanded" data-fps="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meng meter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="widget">
      <div id="pill">
        <div class="ring-wrap">
          <svg viewBox="0 0 56 56" aria-hidden="true">
            <circle class="ring-bg" cx="28" cy="28" r="22" />
            <circle class="ring-fg" id="ring" cx="28" cy="28" r="22" />
          </svg>
          <span id="percent">0%</span>
        </div>
        <div class="mid">
          <div class="speeds">
            <span class="up">↑</span>
            <b class="up" data-speed="up">0B/s</b>
            <span class="down">↓</span>
            <b class="down" data-speed="down">0B/s</b>
          </div>
          <div id="fps">
            <b id="fps-value">--</b>
            <small>FPS</small>
          </div>
        </div>
        <div class="ring-wrap ring-temp">
          <svg viewBox="0 0 56 56" aria-hidden="true">
            <circle class="ring-bg" cx="28" cy="28" r="22" />
            <circle class="ring-fg" id="temp-ring" cx="28" cy="28" r="22" />
          </svg>
          <span id="temp">--</span>
        </div>
      </div>
      <div id="bar">
        <div id="bar-fill"></div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
